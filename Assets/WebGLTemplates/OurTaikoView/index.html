<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OurTaikoView</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:white;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:16px;background:#171717e8}#overlay[hidden]{display:none}button{padding:12px 24px;border:0;border-radius:12px;background:#0071e3;color:white;font:inherit;cursor:pointer}progress{width:min(70vw,360px)}#message{max-width:85vw}</style></head>
<body><canvas id="unity-canvas" tabindex="0"></canvas><div id="overlay"><strong>OurTaikoView</strong><progress id="progress" max="1" value="0"></progress><div id="message" role="status">Loading player…</div><button id="start" hidden>点击开始 / Start</button></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.getElementById('unity-canvas'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),progress=document.getElementById('progress'),start=document.getElementById('start');
const parentOrigin=new URLSearchParams(location.search).get('parentOrigin') || location.origin;
let instance=null,loaded=false,activeRequest='';
function post(data){ if(window.parent!==window) window.parent.postMessage(data,parentOrigin); }
function command(type){if(instance)instance.SendMessage('WebPlayerBridge','Receive',JSON.stringify({channel:'ourtaiko-view',version:1,type,requestId:activeRequest}));}
window.ourTaikoViewEmit=json=>{const data=JSON.parse(json);if(data.type==='ready'&&!instance)return;post(data);if(data.type==='loading'){overlay.hidden=false;start.hidden=true;progress.hidden=true;message.textContent='正在加载谱面与音乐… / Loading…';}if(data.type==='loaded'){loaded=true;overlay.hidden=false;progress.hidden=true;message.textContent='点击开始以启用声音和键盘 / Click to enable audio and keyboard';start.hidden=false;}if(data.type==='error'){overlay.hidden=false;message.textContent='加载失败 / Load failed: '+data.payload.code;start.hidden=true;}if(data.type==='exit'){loaded=false;overlay.hidden=false;start.hidden=true;message.textContent='请选择练习或观看模式 / Select a mode';}};
window.addEventListener('message',event=>{if(event.source!==window.parent||event.origin!==parentOrigin)return;const data=event.data;if(!data||data.channel!=='ourtaiko-view'||data.version!==1||typeof data.type!=='string')return;if(!instance)return;if(data.type==='load'){activeRequest=data.requestId;loaded=false;}instance.SendMessage('WebPlayerBridge','Receive',JSON.stringify(data));});
start.addEventListener('click',()=>{canvas.focus();overlay.hidden=true;});
window.addEventListener('blur',()=>{if(loaded)command('pause');});document.addEventListener('visibilitychange',()=>{if(document.hidden&&loaded)command('pause');});
createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'OurTaiko',productName:'OurTaikoView_Web',productVersion:'1.0',autoSyncPersistentDataPath:false},v=>progress.value=v).then(value=>{instance=value;progress.hidden=true;message.textContent='请选择练习或观看模式 / Select a mode';command('hello');}).catch(error=>{message.textContent=String(error);post({channel:'ourtaiko-view',version:1,type:'error',payload:{code:'PLAYER_BOOT_FAILED'}});});
</script></body></html>
