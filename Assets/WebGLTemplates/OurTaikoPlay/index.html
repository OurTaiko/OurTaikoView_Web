<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 16px; background: #171717; }
    progress { width: min(70vw, 360px); accent-color: #ff344e; }
    #error { max-width: 80vw; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>
  <div id="loading"><strong>{{{ PRODUCT_NAME }}}</strong><progress id="progress" max="1" value="0"></progress><div id="error" role="alert"></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      autoSyncPersistentDataPath: true
    }, value => { document.getElementById("progress").value = value; })
      .then(() => { document.getElementById("loading").remove(); canvas.focus(); })
      .catch(error => { document.getElementById("error").textContent = String(error); });
  </script>
</body>
</html>
